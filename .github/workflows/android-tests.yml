name: Android and iOS regression and UI tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    # Documentation-only changes need no app build.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
permissions:
  contents: read
# A newer push to the same PR cancels the run still going for the older one.
concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: python3 -m unittest discover -s test/tool
      - run: flutter pub get
      - name: Generated files are up to date
        run: bash tool/check-generated.sh
      # Errors and warnings fail; infos (style lints) are reported only.
      - run: flutter analyze --no-fatal-infos
      - name: Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter test --coverage --reporter expanded
      - run: python3 tool/coverage_summary.py coverage/lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage-and-offscreen-ui
          path: |
            coverage/
            build/ui-screenshots/offscreen/
  android-tests:
    needs: [flutter-tests]
    # Keep collecting native/UI evidence while required Flutter gates are red.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    # A cold Gradle build has taken over 30 minutes on a slow runner, which
    # left too little time for the emulator suites within 45 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            mode: granted
          - api: 33
            mode: granted
          - api: 35
            mode: granted
          - api: 35
            mode: denied
          - api: 35
            mode: gps-off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The old SDK "tools" package no longer exists in Google's repository.
          packages: 'platform-tools'
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Bound Gradle memory on hosted runners
        # 2G ran out of heap in packageDebugUnitTestForUnitTest while the
        # in-process Kotlin compile ran; hosted runners have 16G.
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          EOF
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-x64
      - name: Native JVM and WorkManager regression tests
        id: native_tests
        # Still collect emulator evidence if a native regression fails.
        continue-on-error: true
        run: cd android && ./gradlew app:testDebugUnitTest --stacktrace
      - name: Android lint (new issues fail; android/app/lint-baseline.xml lists old ones)
        id: android_lint
        if: matrix.api == 35 && matrix.mode == 'granted'
        continue-on-error: true
        run: cd android && ./gradlew app:lintDebug
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tool/android-all-integration.sh ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}-${{ matrix.mode }}
          path: |
            build/ui-screenshots/android/
            build/android-evidence/
            build/android-feature-evidence/
            build/android-widget-evidence/
            build/app/reports/tests/
            build/app/reports/lint-results-debug.html
            build/app/test-results/
      - name: Preserve failing native release gate
        if: always() && (steps.native_tests.outcome == 'failure' || steps.android_lint.outcome == 'failure')
        run: exit 1

  ios-tests:
    # Native iOS app (ios-native/): EkadashiCore package tests, then the app,
    # widgets, unit and UI screenshot tests on the newest iPhone simulator.
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1 (iPhone Duo SDK), else Xcode 26 (Liquid Glass)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::warning::Xcode 27.1 not on this runner: building with the iOS 26 SDK (the iPhone Duo shows the app at iPhone size)"
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE" ]; then echo "::error::Xcode 26 or newer is required"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: EkadashiCore package tests
        run: cd ios-native/EkadashiCore && swift test -c release
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios-native && xcodegen generate
      - name: Build and test the app, widgets and UI screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 tool/ios/pick_simulator.py)
          echo "Simulator: $UDID"
          mkdir -p build/ios
          cd ios-native
          set +e
          xcodebuild test -project EkadashiCalendar.xcodeproj -scheme EkadashiCalendar \
            -destination "id=$UDID" -resultBundlePath ../build/ios/EkadashiCalendar.xcresult \
            CODE_SIGNING_ALLOWED=NO > ../build/ios/xcodebuild.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* " ../build/ios/xcodebuild.log | tail -300
          exit $status
      - name: Wide-screen UI tests on the iPhone Duo simulator (Xcode 27.1)
        run: |
          set +e
          UDID=$(xcrun simctl list devices available -j | python3 tool/ios/pick_simulator.py --prefer "iPhone Duo")
          if [ $? -eq 3 ]; then echo "No iPhone Duo simulator on this runner: skipped"; exit 0; fi
          echo "Simulator: $UDID"
          cd ios-native
          xcodebuild test -project EkadashiCalendar.xcodeproj -scheme EkadashiCalendar \
            -destination "id=$UDID" -only-testing:EkadashiCalendarUITests/AdaptiveLayoutUITests \
            -resultBundlePath ../build/ios/EkadashiCalendar-duo.xcresult \
            CODE_SIGNING_ALLOWED=NO > ../build/ios/xcodebuild-duo.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* " ../build/ios/xcodebuild-duo.log | tail -100
          exit $status
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/ios/EkadashiCalendar.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ios/EkadashiCalendar.xcresult \
              --output-path build/ios/screenshots || true
          fi
          if [ -d build/ios/EkadashiCalendar-duo.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ios/EkadashiCalendar-duo.xcresult \
              --output-path build/ios/screenshots-duo || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-tests-and-screenshots
          path: |
            build/ios/xcodebuild.log
            build/ios/xcodebuild-duo.log
            build/ios/screenshots/
            build/ios/screenshots-duo/

