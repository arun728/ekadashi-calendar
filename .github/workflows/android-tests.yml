name: Android regression and UI tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  billing-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ekadashi_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: ekadashi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ekadashi_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-test.txt ruff==0.16.10
      - run: ruff check backend && ruff format --check backend
      - run: python -m pytest backend/tests -q --junitxml=build/billing-backend-tests.xml
        env:
          EKADASHI_TEST_DATABASE_URL: postgresql+psycopg://ekadashi_test:local-ci-only@localhost:5432/ekadashi_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-postgresql-tests
          path: build/billing-backend-tests.xml
  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: python3 -m unittest discover -s test/tool
      - run: flutter pub get
      - run: python3 tool/generate_localized_lookup.py && flutter gen-l10n
      # Existing v1 lint debt is reported; analyzer errors remain fatal.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --coverage --reporter expanded
      - run: python3 tool/coverage_summary.py coverage/lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage-and-offscreen-ui
          path: |
            coverage/
            build/ui-screenshots/offscreen/
  android-tests:
    needs: [flutter-tests, billing-backend]
    # Keep collecting native/UI evidence while required Flutter gates are red.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            mode: granted
          - api: 33
            mode: granted
          - api: 35
            mode: granted
          - api: 35
            mode: denied
          - api: 35
            mode: gps-off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The old SDK "tools" package no longer exists in Google's repository.
          packages: 'platform-tools'
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Bound Gradle memory on hosted runners
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          EOF
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-x64
      - name: Native JVM and WorkManager regression tests
        id: native_tests
        # Still collect emulator evidence if a native regression fails.
        continue-on-error: true
        run: cd android && ./gradlew app:testDebugUnitTest
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tool/android-all-integration.sh ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}-${{ matrix.mode }}
          path: |
            build/ui-screenshots/android/
            build/android-evidence/
            build/android-feature-evidence/
            build/android-widget-evidence/
            build/app/reports/tests/
            build/app/test-results/
      - name: Preserve failing native release gate
        if: always() && steps.native_tests.outcome == 'failure'
        run: exit 1

  glass-preview:
    if: github.head_ref == 'feature/android-glass-navigation' || github.head_ref == 'feature/subscriptions-rewards'
    needs: flutter-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get
      - run: bash tool/build-glass-preview.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ekadashi-glass-preview-arm64
          path: build/glass-preview/ekadashi-glass-preview-arm64.apk
