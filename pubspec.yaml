name: ekadashi_calendar
description: "Ekadashi Calendar App"
publish_to: 'none'

version: 2.0.0+5

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Sharing
  share_plus: ^7.2.2

  # Core
  intl: ^0.20.0
  shared_preferences: ^2.5.4
  provider: ^6.1.1

  # Notifications (flutter_local_notifications kept for test notifications display)
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2
  flutter_timezone: ^3.0.0

  characters: ^1.4.0

  # UI
  table_calendar: ^3.2.0
  sqflite: ^2.4.2
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.2
  http: ^1.2.2
  path: ^1.9.1
  uuid: ^4.5.2
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.0
  url_launcher: ^6.3.2

  # ============================================================
  # REMOVED DEPENDENCIES (v2.0 - replaced with native Kotlin)
  # ============================================================
  # geolocator: ^14.0.2      # REMOVED - causes app freeze on activity recreation
  # geocoding: ^4.0.0        # REMOVED - no longer needed
  # app_settings: ^5.1.1     # REMOVED - causes freeze when returning from settings

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  in_app_purchase_platform_interface: 1.4.1
  sqflite_common_ffi: 2.3.6
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/ekadashi_data.json
    - assets/images/
    - assets/calendar/
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00A19B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# Use the system SQLite library for deterministic Linux tests (no native download).
dependency_overrides:
  sqlite3: 2.9.4
